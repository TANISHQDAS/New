<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fact Knowledge Layer</title>
  <link rel="stylesheet" href="/static/aws-theme.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>Fact Knowledge Layer System</h1>
    <p>Abhi Pandey (23BAI10909) | Superjoin Assignment</p>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- Controls -->
    <div class="control-box">
      <div>
        <label for="datasetSelect">Dataset:</label>
        <select id="datasetSelect" onchange="loadDataset(this.value)">
          <option value="delhivery">Delhivery Filings</option>
          <option value="india-macroeconomy">India Macroeconomy</option>
        </select>
      </div>
      <div>
        <button class="btn" onclick="document.getElementById('pdfFileInput').click()">Upload PDF</button>
        <input type="file" id="pdfFileInput" accept=".pdf" style="display: none;" onchange="uploadPDF(this.files[0])">
      </div>
    </div>
    
    <div id="uploadStatus"></div>

    <!-- Section 1: Cases -->
    <div class="section">
      <h2>1. Benchmark Cases</h2>
      <div id="casesGrid">
        <!-- Loaded by JS -->
      </div>
    </div>

    <!-- Section 2: Facts Table -->
    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 style="margin: 0; border: none; padding: 0;">2. Extracted Facts (<span id="factCountText">0</span>)</h2>
        <input type="text" id="factSearch" placeholder="Search facts..." onkeyup="filterFactsTable()" style="width: 200px;">
      </div>
      <table>
        <thead>
          <tr>
            <th>Metric</th>
            <th>Value</th>
            <th>Timeframe</th>
            <th>Document</th>
            <th>Page</th>
            <th>Quote</th>
          </tr>
        </thead>
        <tbody id="factsTableBody">
          <!-- Loaded by JS -->
        </tbody>
      </table>
    </div>

  </main>

  <footer class="footer">
    Fact Knowledge Layer System
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
