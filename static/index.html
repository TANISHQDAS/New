<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Fact Extractor & Checker</title>
  <link rel="stylesheet" href="/static/aws-theme.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>Simple PDF Fact Extractor</h1>
    <p>Superjoin Hiring Assignment | Abhi Pandey (23BAI10909)</p>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- Controls -->
    <div class="control-box">
      <div>
        <label for="datasetSelect">Select Starter Dataset:</label>
        <select id="datasetSelect" onchange="loadDataset(this.value)">
          <option value="delhivery">Delhivery Filings</option>
        </select>
      </div>
      <div>
        <button class="btn" onclick="document.getElementById('pdfFileInput').click()">Upload Any PDF File</button>
        <input type="file" id="pdfFileInput" accept=".pdf" style="display: none;" onchange="uploadPDF(this.files[0])">
      </div>
    </div>
    
    <div id="uploadStatus"></div>

    <!-- Section 1: 4 Cases -->
    <div class="section">
      <h2>1. Analysis Cases (4 Benchmark Cases)</h2>
      <div id="casesGrid"></div>
    </div>

    <!-- Section 2: Extracted Facts -->
    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 style="margin: 0; border: none; padding: 0;">2. All Extracted Facts (<span id="factCountText">0</span>)</h2>
        <input type="text" id="factSearch" placeholder="Search facts..." onkeyup="filterFactsTable()" style="width: 220px;">
      </div>
      <table>
        <thead>
          <tr>
            <th>Metric Name</th>
            <th>Extracted Value</th>
            <th>Year / Period</th>
            <th>PDF File</th>
            <th>Page</th>
            <th>Original Text Quote</th>
          </tr>
        </thead>
        <tbody id="factsTableBody"></tbody>
      </table>
    </div>

  </main>

  <footer class="footer">
    PDF Fact Knowledge Layer — Simple & Basic Prototype
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
